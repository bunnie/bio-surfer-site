<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>codezoom-web</title>
<style>
  :root { --hl: #2d4f67; --bar: #1d1f23; --pane: #16181c; --txt: #d7dae0; --dim: #8b929e; --accent: #5aa9e6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--pane); color: var(--txt);
               font-family: system-ui, sans-serif; }
  #bar { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
         padding: .5rem .75rem; background: var(--bar); border-bottom: 1px solid #000; }
  #bar label { font-size: .85rem; color: var(--dim); }
  #bar input[type=text] { width: 8rem; }
  #bar input#stateInput { width: 16rem; }
  #bar button { font: inherit; font-size: .8rem; padding: .2rem .6rem; cursor: pointer;
                background: #2a2d33; color: var(--txt); border: 1px solid #000; border-radius: 4px; }
  #bar button:hover { background: #343840; }
  #status { margin-left: auto; font-size: .8rem; color: var(--dim); }
  #split { display: flex; height: calc(100% - 3rem); }

  /* draggable divider between the two panes */
  #divider { flex: 0 0 6px; background: #000; cursor: col-resize; }
  #divider:hover, #divider.dragging { background: var(--accent); }
  body.resizing { user-select: none; cursor: col-resize; }
  body.resizing #viewer { pointer-events: none; }  /* keep the drag in the parent doc */

  /* viewer pane wraps the iframe so the loading overlay can sit on top of it */
  #viewerwrap { flex: 0 0 55%; position: relative; min-width: 0; }
  #viewer { width: 100%; height: 100%; border: 0; background: #909090; display: block; }

  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
             gap: .8rem; align-items: center; justify-content: center;
             background: rgba(22, 24, 28, .88); color: var(--txt); font-size: .9rem;
             transition: opacity .35s ease; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 38px; height: 38px; border: 4px solid rgba(139, 146, 158, .35);
             border-top-color: var(--accent); border-radius: 50%;
             animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #codewrap { flex: 1 1 0; min-width: 0; overflow: auto; background: var(--pane); }
  #code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          font-size: 12.5px; line-height: 1.45; white-space: pre; }
  .ln { padding: 0 .75rem; }
  .ln.hl { background: var(--hl); }
  #code:empty::after { content: "Load a disassembly listing (.lst / .dis) to begin.";
          color: var(--dim); display: block; padding: 1rem; white-space: normal;
          font-family: system-ui, sans-serif; }
</style>
</head>
<body>
  <div id="bar">
    <label>waveform <input type="file" id="fstInput" accept=".fst,.vcd,.ghw,.fst.gz"></label>
    <label>listing <input type="file" id="lstInput" accept=".lst,.dis,.txt,.asm"></label>
    <label>PC signal <input type="text" id="sigInput" value="execute_PC"></label>
    <label>state <input type="text" id="stateInput" placeholder="(none — clean load)"></label>
    <label title="Use your own saved layout (.surf.ron) instead of the URL above">state file <input type="file" id="stateFileInput" accept=".ron,.surf.ron"></label>
    <button id="refreshBtn" title="Reload the current waveform (fresh) and re-apply the state">↻ Refresh</button>
    <span id="status">starting viewer…</span>
  </div>
  <div id="split">
    <div id="viewerwrap">
      <!-- Point this at wherever you host the patched Surfer build (the trunk `dist/`). -->
      <!-- The #dev suffix disables Surfer's service-worker cache during development. -->
      <iframe id="viewer" src="./viewer/index.html#dev"></iframe>
      <div id="overlay"><div class="spinner"></div><div id="ovlabel">Loading viewer…</div></div>
    </div>
    <div id="divider" title="Drag to resize"></div>
    <div id="codewrap"><div id="code"></div></div>
  </div>

<script>
(function () {
  "use strict";

  // ====== DEFAULTS ==========================================================
  // One RTL codebase: load the same waveform + same saved layout on startup.
  // Keep these RELATIVE to this page — the same file then works unchanged on
  // localhost and in production (e.g. /bio-surfer/...). Set any to null to skip.
  const DEFAULT_WAVE_URL    = "./waves/sce.fst";        // waveform served on this site
  const DEFAULT_STATE_URL   = "./state/sce.surf.ron";   // saved Surfer layout (.surf.ron)
  const DEFAULT_LISTING_URL = "./listings/sce.dis";     // disassembly shown in the code pane
  // ==========================================================================

  const $ = (id) => document.getElementById(id);
  const codeEl = $("code"), statusEl = $("status"), viewer = $("viewer");
  const overlay = $("overlay"), ovlabel = $("ovlabel");

  let surferReady = false;
  let pendingFstUrl = null;        // object URL queued until the viewer signals ready
  let waveLoaded = false;          // a waveform is drawn, so load_state is safe now
  let pendingState = null;         // .ron (URL string or Uint8Array) to apply once the current wave finishes loading
  let stateFileBytes = null;       // locally-picked .surf.ron; overrides the URL box when set
  let lineEls = [];                // one <div> per listing line
  let exact = new Map();           // "addr(decimal string)" -> line index
  let sorted = [];                 // [{a: BigInt, i: int}] ascending, for floor lookup
  let curHl = -1;
  let overlayTimer = null;

  const setStatus = (s) => { statusEl.textContent = s; };

  // Resolve a path against THIS page's URL so relative defaults work on any host,
  // and so the iframe (which would otherwise resolve relative to /viewer/) gets a
  // fully-qualified URL. Absolute URLs and blob: URLs pass through unchanged.
  const resolve = (p) => (p ? new URL(p, window.location.href).href : null);

  // ---- loading overlay -----------------------------------------------------
  function showOverlay(text) {
    ovlabel.textContent = text;
    overlay.classList.remove("hidden");
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => {           // safety: never block the UI forever
      hideOverlay();
      setStatus("load timed out — check the console / network tab");
    }, 60000);
  }
  function hideOverlay() {
    clearTimeout(overlayTimer);
    overlay.classList.add("hidden");
  }

  // ---- disassembly listing -------------------------------------------------
  // Match the leading hex address token of an objdump-style line, e.g.
  //   "   80000124:\t00000013  nop"  ->  80000124
  const ADDR_RE = /^\s*([0-9a-fA-F]+):/;

  function loadListing(text) {
    const lines = text.split(/\r?\n/);
    exact = new Map();
    sorted = [];
    codeEl.textContent = "";
    lineEls = [];

    const frag = document.createDocumentFragment();
    lines.forEach((ln, i) => {
      const div = document.createElement("div");
      div.className = "ln";
      div.textContent = ln === "" ? "\u00a0" : ln;
      frag.appendChild(div);
      lineEls.push(div);

      const m = ln.match(ADDR_RE);
      if (m) {
        const a = BigInt("0x" + m[1]);
        const key = a.toString();
        if (!exact.has(key)) exact.set(key, i);
        sorted.push({ a, i });
      }
    });
    codeEl.appendChild(frag);
    sorted.sort((x, y) => (x.a < y.a ? -1 : x.a > y.a ? 1 : 0));
    setStatus(`listing: ${lines.length} lines, ${sorted.length} addresses`);
  }

  function highlightPc(pc) {
    let idx = exact.get(pc.toString());
    if (idx === undefined && sorted.length) {
      // floor: greatest address <= pc (covers PCs landing mid-instruction)
      let lo = 0, hi = sorted.length - 1, best = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (sorted[mid].a <= pc) { best = mid; lo = mid + 1; } else hi = mid - 1;
      }
      if (best >= 0) idx = sorted[best].i;
    }
    if (idx === undefined) { setStatus(`PC 0x${pc.toString(16)}: no matching line`); return; }

    if (curHl >= 0 && lineEls[curHl]) lineEls[curHl].classList.remove("hl");
    const el = lineEls[idx];
    if (el) {
      el.classList.add("hl");
      el.scrollIntoView({ block: "center", behavior: "smooth" });
    }
    curHl = idx;
    setStatus(`PC 0x${pc.toString(16)} -> line ${idx + 1}`);
  }

  // ---- handle a cursor_set event ------------------------------------------
  function onCursorSet(msg) {
    const sig = ($("sigInput").value || "dbg_pc").trim();
    const hit = (msg.values || []).find((v) => v.name && v.name.endsWith(sig));
    if (!hit) return;
    let pc;
    try { pc = BigInt("0x" + hit.value); } catch { return; }  // value is hex, no 0x
    highlightPc(pc);
  }

  // ---- messages forwarded up from the iframe bridge ------------------------
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "surfer-bridge") return;

    if (d.kind === "ready") {
      surferReady = true;
      if (pendingFstUrl) {
        loadWave(pendingFstUrl);                        // a file picked before ready
        pendingFstUrl = null;
      } else if (DEFAULT_WAVE_URL) {
        loadWave(DEFAULT_WAVE_URL);                     // default "start here" waveform
      } else {
        setStatus("viewer ready");
        hideOverlay();                                  // nothing to auto-load
      }
      return;
    }

    if (d.kind === "wcp" && d.msg && d.msg.type === "event") {
      if (d.msg.event === "cursor_set") {
        onCursorSet(d.msg);
      } else if (d.msg.event === "waveforms_loaded") {
        if (pendingState) { applyState(pendingState); pendingState = null; }
        waveLoaded = true;
        setStatus("ready");
        hideOverlay();                                  // waveform is drawn
      }
    }
  });

  // ---- loading the waveform + saved layout into the embedded viewer --------
  let currentWaveUrl = null;   // last waveform source (URL or blob:) — used by Refresh

  // The state to apply, read live from the toolbar: a locally-picked file wins,
  // otherwise the URL box (blank = clean load).
  function stateSource() {
    if (stateFileBytes) return stateFileBytes;
    const v = $("stateInput").value.trim();
    return v || null;
  }

  // Loads `src` and re-applies the configured state once the wave finishes
  // (load_state needs a waveform already present, or it drops the items).
  // `bust` appends a cache-buster so a re-run sim's updated file is actually fetched.
  function loadWave(src, bust) {
    if (!src) return;
    currentWaveUrl = src;
    pendingState = stateSource();
    let url = resolve(src);
    if (bust && !url.startsWith("blob:")) {
      url += (url.includes("?") ? "&" : "?") + "_=" + Date.now();
    }
    showOverlay("Loading waveform…");
    viewer.contentWindow.postMessage({ command: "LoadUrl", url }, "*");
    setStatus("loading waveform…");
  }

  // Applies a saved layout — from a server URL (string) or a locally-picked file
  // (Uint8Array) — by injecting LoadStateFromData(Vec<u8>).
  async function applyState(src) {
    try {
      let buf;
      if (typeof src === "string") {
        buf = new Uint8Array(await (await fetch(resolve(src), { cache: "no-store" })).arrayBuffer());
      } else {
        buf = src;
      }
      const msg = JSON.stringify({ LoadStateFromData: Array.from(buf) });
      viewer.contentWindow.postMessage({ command: "InjectMessage", message: msg }, "*");
      setStatus("applied saved layout");
    } catch (e) {
      console.error("state load failed", e);
      setStatus("state load failed (see console)");
    }
  }

  $("fstInput").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);    // blob: URL, fetchable by the viewer
    if (surferReady) loadWave(url); else pendingFstUrl = url;
  });

  $("lstInput").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    f.text().then(loadListing);
  });

  // Browse for a local .surf.ron: apply it immediately once a waveform is on
  // screen (load_state needs one present), and remember it so Refresh and
  // waveform picks keep re-applying the same layout. Editing the URL box
  // clears this override and switches back to URL-based loading.
  $("stateFileInput").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    f.arrayBuffer().then((b) => {
      stateFileBytes = new Uint8Array(b);
      if (waveLoaded) applyState(stateFileBytes);
      else pendingState = stateFileBytes;
      setStatus(`state file: ${f.name}`);
    });
    e.target.value = "";                       // allow re-picking the same file
  });

  // Typing (or clearing) the URL box switches back to URL-based loading
  $("stateInput").addEventListener("input", () => { stateFileBytes = null; });

  // state box starts at the coded default; edit it to change what future loads apply
  $("stateInput").value = DEFAULT_STATE_URL || "";

  // Refresh: re-fetch the current waveform (fresh, cache-busted) and re-apply state
  $("refreshBtn").addEventListener("click", () => {
    if (!surferReady) return;
    loadWave(currentWaveUrl || DEFAULT_WAVE_URL, true);
  });

  // ---- resizable split between viewer and code -----------------------------
  const splitEl = $("split"), viewerwrap = $("viewerwrap"), divider = $("divider");
  const SPLIT_KEY = "codezoom.split.pct";

  function setSplit(pct) {
    pct = Math.min(90, Math.max(10, pct));     // keep both panes usable
    viewerwrap.style.flexBasis = pct + "%";
  }

  let savedSplit = NaN;
  try { savedSplit = parseFloat(localStorage.getItem(SPLIT_KEY)); } catch {}
  if (!isNaN(savedSplit)) setSplit(savedSplit);

  let dragging = false;
  divider.addEventListener("mousedown", (e) => {
    dragging = true;
    document.body.classList.add("resizing");
    divider.classList.add("dragging");
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const r = splitEl.getBoundingClientRect();
    setSplit(((e.clientX - r.left) / r.width) * 100);
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove("resizing");
    divider.classList.remove("dragging");
    const pct = parseFloat(viewerwrap.style.flexBasis);
    if (!isNaN(pct)) { try { localStorage.setItem(SPLIT_KEY, pct.toFixed(1)); } catch {} }
  });

  // ---- default disassembly listing on startup ------------------------------
  // The code pane is independent of the viewer, so load this immediately.
  if (DEFAULT_LISTING_URL) {
    fetch(resolve(DEFAULT_LISTING_URL))
      .then((r) => r.text())
      .then(loadListing)
      .catch((e) => {
        console.error("listing load failed", e);
        setStatus("listing load failed (see console)");
      });
  }
})();
</script>
</body>
</html>
